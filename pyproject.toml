[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "atlas-next"
version = "0.1.0"
description = "A deterministic, evidence-first work engine"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6,<0.16",
]

[project.scripts]
atlas-next = "atlas_next.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_next"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

